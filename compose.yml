services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mediscreen-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - mediscreen-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  mongodb:
    image: mongo:8.0
    container_name: mediscreen-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: "MediscreenNoteDb"

    volumes:
      - mediscreen-mongodb-data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  authentication-service:
    image: mediscreen-authentication-service
    container_name: mediscreen-authentication-service
    restart: unless-stopped

    build:
      context: .
      dockerfile: AuthenticationService.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__AuthenticationDatabase: "Server=sqlserver,1433;Database=MediscreenIdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"

      DemoUser__Email: "${DEMO_USER_EMAIL}"
      DemoUser__Password: "${DEMO_USER_PASSWORD}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Mediscreen.Gateway"
      Jwt__Audience: "Mediscreen.Services"
      Jwt__ExpirationMinutes: "60"

    ports:
      - "5067:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

  patient-service:
    image: mediscreen-patient-service
    container_name: mediscreen-patient-service
    restart: unless-stopped

    build:
      context: .
      dockerfile: PatientService.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__PatientDatabase: "Server=sqlserver,1433;Database=MediscreenPatientDb;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Mediscreen.Gateway"
      Jwt__Audience: "Mediscreen.Services"

    ports:
      - "5206:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

  note-service:
    image: mediscreen-note-service
    container_name: mediscreen-note-service
    restart: unless-stopped

    build:
      context: .
      dockerfile: NoteService.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_HTTP_PORTS: "8080"

      MongoDb__ConnectionString: "mongodb://mongodb:27017"
      MongoDb__DatabaseName: "MediscreenNoteDb"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Mediscreen.Gateway"
      Jwt__Audience: "Mediscreen.Services"

    ports:
      - "5026:8080"

    depends_on:
      mongodb:
        condition: service_healthy

  note-seeder:
    image: mediscreen-note-service
    container_name: mediscreen-note-seeder
    restart: "no"

    build:
      context: .
      dockerfile: NoteService.Api/Dockerfile

    command:
      - "seed"
      - "notes"

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"

      MongoDb__ConnectionString: "mongodb://mongodb:27017"
      MongoDb__DatabaseName: "MediscreenNoteDb"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Mediscreen.Gateway"
      Jwt__Audience: "Mediscreen.Services"

    depends_on:
      mongodb:
        condition: service_healthy

  risk-service:
    image: mediscreen-risk-service
    container_name: mediscreen-risk-service
    restart: unless-stopped

    build:
      context: .
      dockerfile: RiskService.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_HTTP_PORTS: "8080"

      ServiceUrls__PatientService: "http://patient-service:8080"
      ServiceUrls__NoteService: "http://note-service:8080"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Mediscreen.Gateway"
      Jwt__Audience: "Mediscreen.Services"

    ports:
      - "5023:8080"

    depends_on:
      patient-service:
        condition: service_started
      note-service:
        condition: service_started

  gateway:
    image: mediscreen-gateway
    container_name: mediscreen-gateway
    restart: unless-stopped

    build:
      context: .
      dockerfile: Mediscreen.Gateway/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_HTTP_PORTS: "8080"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Mediscreen.Gateway"
      Jwt__Audience: "Mediscreen.Services"

    ports:
      - "7280:8080"

    depends_on:
      authentication-service:
        condition: service_started
      patient-service:
        condition: service_started
      note-service:
        condition: service_started
      risk-service:
        condition: service_started

  frontend:
    image: mediscreen-frontend
    container_name: mediscreen-frontend
    restart: unless-stopped

    build:
      context: .
      dockerfile: Mediscreen.Frontend/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_HTTP_PORTS: "8080"

      Gateway__BaseUrl: "http://gateway:8080"

    ports:
      - "7141:8080"

    depends_on:
      gateway:
        condition: service_started

volumes:
  mediscreen-sqlserver-data:
  mediscreen-mongodb-data: